<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZORO XITER</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #080808;
    color: white;
    min-height: 100vh;
    padding: 25px 18px;
}

.container {
    max-width: 420px;
    margin: auto;
}

.logo {
    text-align: center;
    margin: 35px 0;
}

.logo h1 {
    color: #ff2020;
    font-size: 35px;
    letter-spacing: 3px;
    text-shadow: 0 0 15px #ff0000;
}

.logo p {
    color: #888;
    font-size: 12px;
    letter-spacing: 4px;
    margin-top: 8px;
}

.card {
    background: #151515;
    border: 1px solid #333;
    border-radius: 15px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 0 20px #180000;
}

h2 {
    color: #ff2929;
    text-align: center;
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 15px;
    background: #080808;
    border: 1px solid #444;
    border-radius: 8px;
    color: white;
    margin-bottom: 15px;
    outline: none;
    text-align: center;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 8px;
    background: #e60000;
    color: white;
    font-weight: bold;
    font-size: 15px;
    margin-top: 10px;
    cursor: pointer;
}

button:active {
    transform: scale(0.97);
}

.secondary {
    background: #242424;
    border: 1px solid #ff2929;
}

#main {
    display: none;
}

.option {
    display: flex;
    justify-content: space-between;
    padding: 16px 5px;
    border-bottom: 1px solid #333;
    color: #ddd;
}

.status {
    color: #00e676;
    text-align: center;
    margin-top: 15px;
    font-size: 13px;
}

.footer {
    text-align: center;
    color: #555;
    font-size: 11px;
    margin-top: 30px;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">
    <h1>ZORO XITER</h1>
    <p>PREMIUM GAMING PANEL</p>
</div>

<div class="card" id="login">

    <h2>LICENSE ACTIVATION</h2>

    <input type="text" id="key"
    placeholder="Enter Your License Key">

    <button onclick="activate()">ACTIVATE NOW</button>

    <p class="status" id="message">
        Secure License Login
    </p>

</div>

<div id="main">

    <div class="card">
        <h2>WELCOME TO ZORO</h2>
        <p style="text-align:center;color:#aaa">
            Your panel is ready.
        </p>

        <button onclick="openGame()">
            OPEN FREE FIRE
        </button>
    </div>

    <div class="card">
        <h2>SETTINGS</h2>

        <div class="option">
            <span>Gaming Mode</span>
            <input type="checkbox" checked>
        </div>

        <div class="option">
            <span>Sound Settings</span>
            <input type="checkbox" checked>
        </div>

        <div class="option">
            <span>Performance Tips</span>
            <input type="checkbox" checked>
        </div>

        <button class="secondary" onclick="logout()">
            LOG OUT
        </button>
    </div>

</div>

<div class="footer">
    ZORO XITER © 2026<br>
    PREMIUM GAMING EXPERIENCE
</div>

</div>

<script>
function activate() {
    let key = document.getElementById("key").value.trim();

    if (key === "ZORO-3105") {
        document.getElementById("login").style.display = "none";
        document.getElementById("main").style.display = "block";
    } else {
        document.getElementById("message").innerText =
        "Invalid License Key!";
    }
}

function logout() {
    document.getElementById("main").style.display = "none";
    document.getElementById("login").style.display = "block";
    document.getElementById("key").value = "";
}

function openGame() {
    alert("Please open Free Fire from your iPhone.");
}
</script>

</body>
</html>
